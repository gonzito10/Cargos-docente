<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargos docentes en profesorados · PBA y CABA</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --mute:#5d6877; --line:#e1e5ea; --acc:#1f5fbf;
          --ok:#1a7f4b; --okbg:#e6f4ec; --warn:#9a6700; --warnbg:#fff4d6; --off:#6b7280; --offbg:#eceef1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b2129; --ink:#e8ecf1; --mute:#9aa6b5; --line:#2a323d; --acc:#6ea4ff;
            --ok:#5fd394; --okbg:#173326; --warn:#f0c15a; --warnbg:#3a2f12; --off:#9aa6b5; --offbg:#272d36; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 16px 8px; max-width:880px; margin:0 auto; }
  h1 { font-size:1.35rem; margin:0 0 4px; }
  .sub { color:var(--mute); font-size:.88rem; }
  main { max-width:880px; margin:0 auto; padding:8px 16px 48px; }
  .filters { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0; display:grid; gap:8px;
             grid-template-columns:1fr 1fr; border-bottom:1px solid var(--line); }
  .filters input { grid-column:1 / -1; }
  input, select { width:100%; padding:11px 12px; font:inherit; color:var(--ink); background:var(--card);
                  border:1px solid var(--line); border-radius:10px; }
  .count { color:var(--mute); font-size:.88rem; margin:12px 2px 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .top { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:6px; }
  .pill { font-size:.74rem; padding:2px 8px; border-radius:99px; background:var(--offbg); color:var(--off); font-weight:600; }
  .pill.ok { background:var(--okbg); color:var(--ok); } .pill.warn { background:var(--warnbg); color:var(--warn); }
  .inst { font-weight:650; } .title { margin:4px 0 8px; word-break:break-word; }
  .meta { color:var(--mute); font-size:.85rem; display:flex; gap:14px; flex-wrap:wrap; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 0; }
  .chip { font-size:.78rem; border:1px solid var(--line); border-radius:8px; padding:2px 8px; }
  .btn { display:inline-block; margin-top:12px; padding:9px 14px; border-radius:9px; background:var(--acc); color:#fff;
         text-decoration:none; font-weight:600; font-size:.92rem; }
  .empty { text-align:center; color:var(--mute); padding:40px 12px; }
  footer { color:var(--mute); font-size:.8rem; margin-top:24px; }
  @media (min-width:700px) { .filters { grid-template-columns:2fr 1fr 1fr 1fr; } .filters input { grid-column:auto; } }
</style>
</head>
<body>
<header>
  <h1>Cargos docentes en profesorados</h1>
  <div class="sub" id="updated">Cargando…</div>
</header>
<main>
  <div class="filters">
    <input id="q" type="search" placeholder="Buscar materia, profesorado, instituto…" autocomplete="off">
    <select id="jur"><option value="">PBA y CABA</option><option>PBA</option><option>CABA</option></select>
    <select id="inst"><option value="">Todos los institutos</option></select>
    <select id="est">
      <option value="vigentes">Vigentes</option>
      <option value="abiertas">Solo con inscripción abierta</option>
      <option value="todas">Todas (incluye cerradas)</option>
    </select>
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
  <footer>
    La información se recolecta automáticamente de las webs de cada instituto y de los sitios oficiales.
    Las fechas de cierre se detectan leyendo el texto del PDF y pueden ser incorrectas:
    confirmá siempre en la convocatoria original antes de postularte.
  </footer>
</main>
<script>
const $ = id => document.getElementById(id);
const strip = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = new Date(); today.setHours(0,0,0,0);
const fmt = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString("es-AR", {day:"numeric", month:"short", year:"numeric"}) : "—";
const daysAgo = iso => Math.floor((today - new Date(iso + "T00:00:00")) / 864e5);

let ITEMS = [];

function estado(it) {
  if (it.cierre) {
    const d = new Date(it.cierre + "T00:00:00");
    return d >= today ? "abierta" : "cerrada";
  }
  return daysAgo(it.fecha) <= 21 ? "reciente" : "sinfecha";
}
const LABEL = {abierta:["Inscripción abierta","ok"], reciente:["Reciente · cierre no detectado","warn"],
               cerrada:["Cerrada",""], sinfecha:["Sin fecha de cierre",""]};

function render() {
  const terms = strip($("q").value).split(/\s+/).filter(Boolean);
  const jur = $("jur").value, inst = $("inst").value, est = $("est").value;
  const rows = ITEMS.filter(it => {
    const e = estado(it);
    if (est === "vigentes" && !(e === "abierta" || e === "reciente")) return false;
    if (est === "abiertas" && e !== "abierta") return false;
    if (jur && it.jurisdiccion !== jur) return false;
    if (inst && it.instituto !== inst) return false;
    const hay = strip([it.titulo, it.instituto, (it.profesorados||[]).join(" "), it.texto].join(" "));
    return terms.every(t => hay.includes(t));
  });
  $("count").textContent = rows.length + (rows.length === 1 ? " convocatoria" : " convocatorias");
  $("list").innerHTML = rows.length ? rows.map(it => {
    const e = estado(it), [lbl, cls] = LABEL[e];
    const chips = (it.profesorados || []).map(p => `<span class="chip">${esc(p)}</span>`).join("");
    return `<article class="card">
      <div class="top"><span class="pill ${cls}">${lbl}</span><span class="pill">${esc(it.jurisdiccion)}</span></div>
      <div class="inst">${esc(it.instituto)}</div>
      <div class="title">${esc(it.titulo)}</div>
      <div class="meta"><span>Publicada: ${fmt(it.fecha)}</span>${it.cierre ? `<span>Cierre: ${fmt(it.cierre)}</span>` : ""}</div>
      ${chips ? `<div class="chips">${chips}</div>` : ""}
      <a class="btn" href="${esc(it.url)}" target="_blank" rel="noopener">Ver convocatoria (PDF)</a>
    </article>`;
  }).join("") : `<div class="empty">No hay convocatorias con esos filtros.<br>Probá con “Todas” o con otra búsqueda.</div>`;
}

async function init() {
  try {
    const r = await fetch("data/convocatorias.json", {cache: "no-cache"});
    const data = await r.json();
    ITEMS = data.items || [];
    if (data.actualizado) {
      $("updated").textContent = `Actualizado el ${fmt(data.actualizado.slice(0,10))} · próxima actualización automática: ${fmt(data.proxima_actualizacion.slice(0,10))}`;
    } else {
      $("updated").textContent = "Todavía no hay datos: ejecutá la primera actualización (ver README).";
    }
    const insts = [...new Set(ITEMS.map(i => i.instituto))].sort((a,b) => a.localeCompare(b, "es"));
    $("inst").innerHTML += insts.map(i => `<option>${esc(i)}</option>`).join("");
  } catch (e) {
    $("updated").textContent = "No se pudieron cargar los datos.";
  }
  ["q","jur","inst","est"].forEach(id => $(id).addEventListener("input", render));
  render();
}
init();
</script>
</body>
</html>
