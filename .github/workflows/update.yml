name: Actualizar convocatorias

on:
  schedule:
    # Corre todos los días; el script solo actualiza si pasaron 3 días desde la última vez
    # (así el ritmo es exacto aun a fin de mes). 08:17 UTC = 05:17 en Argentina.
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar actualización ahora"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Recolectar
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python scraper/scrape.py --force
          else
            python scraper/scrape.py
          fi
      - name: Guardar cambios
        run: |
          git config user.name "actualizador-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/convocatorias.json
          git diff --staged --quiet || (git commit -m "Actualizar convocatorias $(date -u +%F)" && git push)
